name: Build iOS Ipa

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Ipa
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Set iOS deployment target in Podfile
        run: |
          cd ios
          # Set minimum iOS deployment target to 13.0
          if [ -f Podfile ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" Podfile
            sed -i '' "s/platform :ios, '[0-9]*\.[0-9]*'/platform :ios, '13.0'/" Podfile
          fi
          # Also update AppFrameworkInfo.plist MinimumOSVersion
          plutil -replace MinimumOSVersion -string "13.0" Flutter/AppFrameworkInfo.plist || true

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          flutter pub get
          pod install --repo-update
        working-directory: ${{ github.workspace }}

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create Payload directory
        run: mkdir -p Payload
        working-directory: build/ios/iphoneos

      - name: Move Runner.app into Payload
        run: mv Runner.app Payload/
        working-directory: build/ios/iphoneos

      - name: Zip into IPA
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "Congrats"
